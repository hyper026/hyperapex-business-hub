<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Hyperapex Business Hub matter tasks and deadlines"><title>Matter Tasks | Hyperapex</title><link rel="stylesheet" href="styles.css"></head><body><main class="main"><header class="topbar"><div><p class="eyebrow">MATTER MANAGEMENT</p><h1>Tasks & Deadlines</h1><p>Assign, track and complete work across Hyperapex matters.</p></div><a class="logout" href="index.html">Back to Dashboard</a></header><section class="stats"><article><span>Total Tasks</span><strong id="total">—</strong></article><article><span>To Do</span><strong id="todo">—</strong></article><article><span>In Progress</span><strong id="progress">—</strong></article><article><span>Overdue</span><strong id="overdue">—</strong></article></section><section class="panel"><div class="panel-head"><div><p class="eyebrow">WORK QUEUE</p><h2>Matter Tasks</h2></div><div><button id="refresh">Refresh</button><button id="showForm">New Task</button></div></div><form id="taskForm" class="client-form" hidden><div><label>Matter ID<input id="requestId" type="number" min="1" required></label><label>Task title<input id="title" maxlength="255" required></label></div><label>Description<textarea id="description" rows="3"></textarea></label><div><label>Assign to user ID<input id="assignedTo" type="number" min="1"></label><label>Priority<select id="priority"><option>LOW</option><option selected>NORMAL</option><option>HIGH</option><option>URGENT</option></select></label><label>Due date<input id="dueDate" type="date"></label></div><div><button type="submit">Create Task</button><button type="button" id="cancel" class="secondary">Cancel</button></div><p id="message" role="status"></p></form><div class="table-wrap"><table><thead><tr><th>Task</th><th>Matter</th><th>Assignee</th><th>Priority</th><th>Status</th><th>Due</th><th>Action</th></tr></thead><tbody id="rows"><tr><td colspan="7">Loading tasks…</td></tr></tbody></table></div></section></main><script src="tasks.js"></script></body></html>
