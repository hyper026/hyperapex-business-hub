<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Service Requests | Hyperapex</title><link rel="stylesheet" href="styles.css"></head><body><main class="main"><header class="topbar"><div><p class="eyebrow">MATTER MANAGEMENT</p><h1>Service Requests</h1><p>Track client matters from submission to completion.</p></div><a class="logout" href="index.html">Back to Dashboard</a></header><section class="panel"><div class="panel-head"><div><p class="eyebrow">NEW MATTER</p><h2>Create Service Request</h2></div></div><form id="requestForm" class="client-form"><div><label>Client<select id="client" required></select></label><label>Service<select id="service" required></select></label></div><div><label>Title<input id="title" required maxlength="255"></label><label>Priority<select id="priority"><option>NORMAL</option><option>LOW</option><option>HIGH</option><option>URGENT</option></select></label></div><label>Description<textarea id="description" rows="4" required></textarea></label><button type="submit">Create Request</button><p id="message" role="status"></p></form></section><section class="panel"><div class="panel-head"><div><p class="eyebrow">WORK QUEUE</p><h2>Active Requests</h2></div><button id="refresh">Refresh</button></div><div class="table-wrap"><table><thead><tr><th>Reference</th><th>Client</th><th>Service</th><th>Title</th><th>Priority</th><th>Status</th><th>Assigned To</th><th>Action</th></tr></thead><tbody id="rows"><tr><td colspan="8">Loading…</td></tr></tbody></table></div></section></main><script src="requests.js"></script></body></html>
