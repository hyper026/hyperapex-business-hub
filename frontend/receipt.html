<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Hyperapex payment receipt"><title>Payment Receipt | Hyperapex</title><link rel="stylesheet" href="styles.css"><style>.receipt-wrap{max-width:820px;margin:40px auto}.receipt-card{background:#fff;padding:36px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.08)}.receipt-head{display:flex;justify-content:space-between;gap:24px;border-bottom:2px solid #ddd;padding-bottom:20px;margin-bottom:24px}.receipt-total{font-size:28px;font-weight:700}.receipt-actions{margin-top:24px}@media print{.receipt-actions{display:none}.receipt-wrap{margin:0}.receipt-card{box-shadow:none;border:0}}</style></head><body><main class="main"><div class="receipt-wrap"><div class="receipt-card"><header class="receipt-head"><div><p class="eyebrow">HYPERAPEX CONSULTANCY FIRM LIMITED</p><h1>Payment Receipt</h1><p>Official acknowledgement of payment received.</p></div><div><strong id="receiptNumber">—</strong><br><span id="receiptDate">—</span></div></header><section><p><strong>Received from</strong><br><span id="clientName">—</span><br><span id="clientContact">—</span></p><p><strong>Invoice</strong><br><span id="invoiceNumber">—</span></p></section><section class="finance-cards"><article><span>Amount Paid</span><strong id="amount">KES 0.00</strong></article><article><span>Payment Method</span><strong id="method">—</strong></article><article><span>Reference</span><strong id="reference">—</strong></article></section><section><p><strong>Invoice Total:</strong> <span id="invoiceTotal">KES 0.00</span></p><p><strong>Total Paid on Invoice:</strong> <span id="invoicePaid">KES 0.00</span></p><p><strong>Remaining Balance:</strong> <span id="balance">KES 0.00</span></p><p id="notes"></p></section><div class="receipt-actions"><button onclick="window.print()">Print Receipt</button> <button class="secondary" onclick="window.close()">Close</button></div><p id="message" role="status"></p></div></div></main><script>const API_BASE=window.HYPERAPEX_API_BASE||'http://localhost:4000';const token=sessionStorage.getItem('hyperapex_token');if(!token)location.replace('login.html');const money=v=>`KES ${Number(v||0).toLocaleString('en-KE',{minimumFractionDigits:2,maximumFractionDigits:2})}`;const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));async function load(){const id=new URLSearchParams(location.search).get('id');if(!id){document.getElementById('message').textContent='Receipt reference is missing.';return}const r=await fetch(`${API_BASE}/api/payments/${encodeURIComponent(id)}/receipt`,{headers:{Authorization:`Bearer ${token}`}});const d=await r.json();if(!r.ok){document.getElementById('message').textContent=d.error||'Unable to load receipt.';return}const p=d.receipt;document.getElementById('receiptNumber').textContent=p.receipt_number;document.getElementById('receiptDate').textContent=new Date(p.payment_date).toLocaleDateString();document.getElementById('clientName').textContent=p.client_name;document.getElementById('clientContact').textContent=[p.client_email,p.client_phone].filter(Boolean).join(' • ');document.getElementById('invoiceNumber').textContent=p.invoice_number;document.getElementById('amount').textContent=money(p.amount);document.getElementById('method').textContent=p.method||'—';document.getElementById('reference').textContent=p.reference||'—';document.getElementById('invoiceTotal').textContent=money(p.total_amount);document.getElementById('invoicePaid').textContent=money(p.amount_paid);document.getElementById('balance').textContent=money(p.balance_due);document.getElementById('notes').textContent=p.notes?`Notes: ${p.notes}`:''}load();</script></body></html>
